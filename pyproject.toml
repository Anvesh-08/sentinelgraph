[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelgraph"
version = "1.0.0"
description = "Enterprise AML Transaction Monitoring, Shadow-Mode Rule Backtesting, Multi-Hop Graph Investigation & SAR Compliance Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "SentinelGraph Engineering"}
]
keywords = ["aml", "kyc", "fraud-detection", "transaction-monitoring", "graph-analytics", "sar", "compliance", "fintech"]
dependencies = [
    "fastapi>=0.92.0",
    "pydantic>=1.10.4",
    "uvicorn>=0.17.6",
    "httpx>=0.23.3",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "tabulate>=0.9.0",
]

[tool.unittest]
start-dir = "tests"
pattern = "test_*.py"
